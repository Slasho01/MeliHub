[package]
name = "melihub"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.11.0"
actix-files = "0.6.6"
actix-cors = "0.7"
bcrypt = "0.17"
chrono = { version = "0.4.41", features = ["serde"] }
diesel = { version = "2.2.10", features = ["postgres", "uuid", "chrono", "r2d2", "serde_json"] }
diesel_migrations = { version = "2.2.0", features = ["postgres"] }
dotenvy = "0.15.6"
env_logger = "0.11"
log = "0.4"
jsonwebtoken = "9.3.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls-tls", "hostname"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.16.0", features = ["v4", "fast-rng", "serde"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10.3"
base64 = "0.22.1"
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }
totp-rs = { version = "5.7.0", default-features = false, features = ["otpauth", "gen_secret", "qr"] }
sentry = "0.34.0"
sentry-actix = "0.34.0"
futures-util = "0.3"
