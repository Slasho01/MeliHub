# Blueprint de Render para MeliHub: UN solo servicio (Docker) que sirve el panel
# y la API en el mismo origen (sin CORS). La base de datos es EXTERNA (Neon),
# porque el plan free de Render permite una sola BD por cuenta.

services:
  - type: web
    name: melihub
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Connection string de Neon (incluye ?sslmode=require):
      - key: DATABASE_URL
        sync: false
      - key: HOST
        value: 0.0.0.0
      # Cadena larga y aleatoria (mín. 16 caracteres):
      - key: JWT_SECRET
        sync: false
      # Credenciales de la app de Mercado Libre:
      - key: ML_CLIENT_ID
        sync: false
      - key: ML_CLIENT_SECRET
        sync: false
      # Debe apuntar a ESTE servicio (y coincidir con el Redirect URI de la app ML):
      #   https://melihub.onrender.com/api/ml/callback
      - key: ML_REDIRECT_URI
        sync: false
      # URL pública de ESTE servicio (para back_url / webhooks de pago):
      #   https://melihub.onrender.com
      - key: APP_URL
        sync: false
      # Access token de Mercado Pago (del dueño) para cobrar suscripciones.
      # Usa primero el de PRUEBA (TEST-...) para validar sin cobros reales.
      - key: MP_ACCESS_TOKEN
        sync: false
      # Envío de correos (recuperar contraseña, avisos). Resend por HTTP.
      - key: RESEND_API_KEY
        sync: false
      # Remitente verificado en Resend (o "MeliHub <onboarding@resend.dev>" para probar):
      - key: MAIL_FROM
        sync: false
