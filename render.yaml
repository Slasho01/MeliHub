# Blueprint de Render para MeliHub (API + panel).
# La base de datos es EXTERNA (Neon/Supabase), porque el plan free de Render
# permite una sola BD por cuenta. Se pasa como DATABASE_URL (sync:false).

services:
  # --- API (Rust, Docker) ---
  - type: web
    name: melihub-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false        # cadena de conexión de Neon/Supabase (incluye ?sslmode=require)
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        sync: false
      # Credenciales de la app de Mercado Libre (cuando la tengas aprobada):
      - key: ML_CLIENT_ID
        sync: false
      - key: ML_CLIENT_SECRET
        sync: false
      # Debe apuntar a ESTA API (y coincidir con el Redirect URI de la app ML):
      - key: ML_REDIRECT_URI
        sync: false        # https://melihub-api.onrender.com/api/ml/callback
      # URL del panel (para CORS):
      - key: CORS_ORIGINS
        sync: false        # https://melihub-panel.onrender.com

  # --- Panel (React, static site) ---
  - type: web
    name: melihub-panel
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false        # https://melihub-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
